<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados - Imobiliária Viviane de Souza</title>
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="styles/global.css" rel="stylesheet">
    <link href="styles/imoveis.css" rel="stylesheet">
</head>

<body>
    <header id="header"></header>

    <main class="imoveis-main">
        <section class="filtros-aplicados">
            <div class="container">
                <div class="filtros-info">
                    <h1>Imóveis Encontrados</h1>
                    <p id="filtros-texto">Exibindo resultados baseados nos seus filtros</p>
                </div>
                <a href="index.html" class="btn-nova-busca">
                    <i class="bi bi-arrow-left"></i> Nova Busca
                </a>
            </div>
        </section>

        <section class="imoveis-container">
            <div class="container">
                <div id="cards-container" class="row g-4"></div>
            </div>
        </section>
    </main>

    <div class="modal fade" id="modalImovel" tabindex="-1" aria-labelledby="modalImovelLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalImovelLabel">Detalhes do Imóvel</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-4">
                        <div class="col-lg-6">
                            <div id="carouselImovel" class="carousel slide" data-bs-ride="carousel">
                                <div class="carousel-indicators" id="carousel-indicators"></div>
                                <div class="carousel-inner" id="carousel-inner"></div>
                                <button class="carousel-control-prev" type="button" data-bs-target="#carouselImovel"
                                    data-bs-slide="prev">
                                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                    <span class="visually-hidden">Anterior</span>
                                </button>
                                <button class="carousel-control-next" type="button" data-bs-target="#carouselImovel"
                                    data-bs-slide="next">
                                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                    <span class="visually-hidden">Próximo</span>
                                </button>
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <div class="imovel-detalhes-modal">
                                <span class="badge-tipo-modal" id="modal-tipo-badge">Casa</span>
                                <h2 class="imovel-titulo-modal" id="modal-titulo">Título do Imóvel</h2>
                                <p class="imovel-preco-modal" id="modal-preco">R$ 0,00</p>

                                <div class="imovel-info-localizacao">
                                    <i class="bi bi-geo-alt-fill"></i>
                                    <span id="modal-endereco">Endereço</span>
                                </div>

                                <div class="imovel-caracteristicas">
                                    <h3>Características</h3>
                                    <div class="caracteristicas-grid">
                                        <div class="caracteristica-item">
                                            <i class="bi bi-door-closed-fill"></i>
                                            <div>
                                                <span class="caracteristica-label">Dormitórios</span>
                                                <span class="caracteristica-valor" id="modal-dormitorios">0</span>
                                            </div>
                                        </div>
                                        <div class="caracteristica-item">
                                            <i class="bi bi-rulers"></i>
                                            <div>
                                                <span class="caracteristica-label">Área</span>
                                                <span class="caracteristica-valor" id="modal-area">0 m²</span>
                                            </div>
                                        </div>
                                        <div class="caracteristica-item">
                                            <i class="bi bi-car-front-fill"></i>
                                            <div>
                                                <span class="caracteristica-label">Garagem</span>
                                                <span class="caracteristica-valor" id="modal-garagem">Não</span>
                                            </div>
                                        </div>
                                        <div class="caracteristica-item">
                                            <i class="bi bi-house-fill"></i>
                                            <div>
                                                <span class="caracteristica-label">Tipo</span>
                                                <span class="caracteristica-valor" id="modal-tipo">-</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="imovel-descricao-modal">
                                    <h3>Sobre o Imóvel</h3>
                                    <p id="modal-descricao">Descrição do imóvel</p>
                                </div>

                                <div class="imovel-acoes">
                                    <button class="btn-contato">
                                        <i class="bi bi-whatsapp"></i> Entrar em Contato
                                    </button>
                                    <button class="btn-favorito">
                                        <i class="bi bi-heart"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/componentes/cabecalho.js"></script>
    <script src="js/imoveis.js"></script>
</body>

</html>
